<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Subway Dash</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;font-family:Arial Black}canvas{display:block;width:100vw;height:100vh}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:15px;color:#fff;text-shadow:2px 2px 0 #000;z-index:10}</style>
</head>
<body>
<div id="hud"><div>💰 <span id="c">0</span></div><div id="s">0m</div></div>
<canvas id="g"></canvas>
<script>
const canvas=document.getElementById('g'),ctx=canvas.getContext('2d');
canvas.width=450; canvas.height=innerHeight;
let W=450,H=canvas.height,lanes=[75,200,325],lane=1,coins=0,score=0,speed=8,obs=[],coin=[],y=0,vy=0,rolling=false,rollTime=0,game=false,tsX=0,tsY=0;
function reset(){coins=0;score=0;speed=8;obs=[];coin=[];lane=1;y=0;game=true;loop();}
function loop(){if(!game)return;ctx.clearRect(0,0,W,H);ctx.fillStyle="#2a2a2a";ctx.fillRect(0,0,W,H);
for(let i=0;i<3;i++){ctx.fillStyle="#444";ctx.fillRect(lanes[i],0,60,H);ctx.fillStyle="#222";ctx.fillRect(lanes[i]+28,0,4,H);}
score+=speed*0.02;speed+=0.005;document.getElementById('s').innerText=Math.floor(score)+'m';document.getElementById('c').innerText=coins;
let px=lanes[lane]+5,py=H-160+y,ph=rolling?35:70;ctx.fillStyle="#ffde00";ctx.fillRect(px,py-ph,50,ph);
if(y<0){vy+=1.2;y+=vy;if(y>=0){y=0;vy=0;}}if(rolling){rollTime--;if(rollTime<=0)rolling=false;}
if(Math.random()<0.025){let l=Math.floor(Math.random()*3);obs.push({l:l,y:-120,type:Math.random()<0.6?'train':'low'});}
if(Math.random()<0.06)coin.push({l:Math.floor(Math.random()*3),y:-30});
for(let o of obs){o.y+=speed;if(o.type=='train'){ctx.fillStyle=o.l==0?'#00d2ff':o.l==1?'#ff0040':'#00ff88';ctx.fillRect(lanes[o.l]-10,o.y,80,100);}else{ctx.fillStyle="#ff6600";ctx.fillRect(lanes[o.l],o.y+40,60,20);}
if(o.l==lane){if(o.type=='train'&&o.y+100>py-ph&&o.y<py)return over();if(o.type=='low'&&!rolling&&o.y+60>py-ph&&o.y+40<py)return over();}}
for(let c of coin){c.y+=speed;ctx.fillStyle="gold";ctx.beginPath();ctx.arc(lanes[c.l]+30,c.y,14,0,Math.PI*2);ctx.fill();
if(c.l==lane&&Math.abs(c.y-(py-20))<35){coins++;c.y=9999;}}
obs=obs.filter(o=>o.y<H+150);coin=coin.filter(c=>c.y<H+50);requestAnimationFrame(loop);}
function over(){game=false;ctx.fillStyle="rgba(0,0,0,.8)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#fff";ctx.font="bold 40px Arial";ctx.fillText("GAME OVER",W/2-110,H/2-40);ctx.font="20px Arial";ctx.fillText(Math.floor(score)+"m | "+coins+" moedas",W/2-80,H/2);ctx.fillText("Toque pra jogar",W/2-80,H/2+40);canvas.onclick=()=>{canvas.onclick=null;reset();};}
canvas.addEventListener('touchstart',e=>{tsX=e.touches[0].clientX;tsY=e.touches[0].clientY;});
canvas.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-tsX,dy=e.changedTouches[0].clientY-tsY;
if(Math.abs(dx)>Math.abs(dy)){if(dx>30&&lane<2)lane++;if(dx<-30&&lane>0)lane--;}else{if(dy<-30&&y==0)vy=-18;if(dy>30&&!rolling){rolling=true;rollTime=35;}}});
window.addEventListener('keydown',e=>{if(e.key=='ArrowLeft'&&lane>0)lane--;if(e.key=='ArrowRight'&&lane<2)lane++;if(e.key=='ArrowUp'&&y==0)vy=-18;if(e.key=='ArrowDown'&&!rolling){rolling=true;rollTime=35;}});
reset();
</script>
</body>
</html>
