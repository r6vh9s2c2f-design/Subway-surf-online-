<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Subway Surfers 3D</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial Black}
#hud{position:fixed;top:0;left:0;right:0;padding:12px 18px;display:flex;justify-content:space-between;color:#fff;font-size:22px;text-shadow:2px 2px 0 #000;z-index:10}
#gameOver{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:20}
#gameOver h1{font-size:42px;margin-bottom:10px}
.btn{margin-top:20px;background:#00d2ff;padding:14px 28px;border-radius:30px;color:#000;font-size:20px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
</head>
<body>
<div id="hud"><div>💰 <span id="coins">0</span></div><div><span id="score">0</span>m</div></div>
<div id="gameOver"><h1>BATEU!</h1><p id="final"></p><div class="btn" onclick="location.reload()">CORRER DE NOVO</div></div>
<script type="module">
import * as THREE from 'three';
let scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 100);
let renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
scene.fog=new THREE.Fog(0x2a3a4a, 20, 60);

// luz
scene.add(new THREE.AmbientLight(0xffffff,0.8));
let dir=new THREE.DirectionalLight(0xffffff,1); dir.position.set(5,10,5); scene.add(dir);

// chao trilhos
let groundGeo=new THREE.PlaneGeometry(30,200);
let groundMat=new THREE.MeshStandardMaterial({color:0x3a3a3a});
let ground=new THREE.Mesh(groundGeo,groundMat); ground.rotation.x=-Math.PI/2; ground.position.y=-1; ground.position.z=-20;
scene.add(ground);

// trilhos linhas
for(let i=-1;i<=1;i++){ let line=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,200), new THREE.MeshStandardMaterial({color:0xffffff})); line.position.set(i*3,-0.9,-20); scene.add(line); }

// player - boneco correndo
let playerGroup=new THREE.Group();
let body=new THREE.Mesh(new THREE.CapsuleGeometry(0.4,0.8,4,8), new THREE.MeshStandardMaterial({color:0xffde00}));
body.position.y=0.5; playerGroup.add(body);
let head=new THREE.Mesh(new THREE.SphereGeometry(0.4,16,16), new THREE.MeshStandardMaterial({color:0xffcc99})); head.position.y=1.3; playerGroup.add(head);
let leg1=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.6,0.2), new THREE.MeshStandardMaterial({color:0x0044ff})); leg1.position.set(-0.2,0,0);
let leg2=leg1.clone(); leg2.position.x=0.2; playerGroup.add(leg1,leg2);
playerGroup.position.set(0,0,3); scene.add(playerGroup);

let lane=0, targetX=0, lanes=[-3,0,3], isJumping=false, isRolling=false, vy=0, y=0;
let coins=0, score=0, speed=0.25, obstacles=[], coinMeshes=[], game=true;
let clock=new THREE.Clock(), runTime=0;

function addObstacle(){
  let l=Math.floor(Math.random()*3)-1;
  let type=Math.random()<0.5?'train':'bar';
  let mesh;
  if(type=='train'){
    mesh=new THREE.Mesh(new THREE.BoxGeometry(2.5,2,4), new THREE.MeshStandardMaterial({color:0x00d2ff}));
  }else{
    mesh=new THREE.Mesh(new THREE.BoxGeometry(2.5,1,0.8), new THREE.MeshStandardMaterial({color:0xff4400}));
    mesh.userData.low=true;
  }
  mesh.position.set(l*3, type=='train'?0:0.2, -80);
  scene.add(mesh); obstacles.push(mesh);
}
function addCoin(){
  let l=Math.floor(Math.random()*3)-1;
  let m=new THREE.Mesh(new THREE.CylinderGeometry(0.4,0.4,0.1,16), new THREE.MeshStandardMaterial({color:0xffd700}));
  m.rotation.x=Math.PI/2; m.position.set(l*3,1,-80); scene.add(m); coinMeshes.push(m);
}

camera.position.set(0,4,7); camera.lookAt(0,1,-10);

let tsX=0;
window.addEventListener('touchstart',e=>tsX=e.touches[0].clientX);
window.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-tsX;
  if(dx>40 && lane<1){lane++; targetX=lanes[lane+1];}
  if(dx<-40 && lane>-1){lane--; targetX=lanes[lane+1];}
});
window.addEventListener('keydown',e=>{
  if(e.key=='ArrowLeft'&&lane>-1){lane--; targetX=lanes[lane+1];}
  if(e.key=='ArrowRight'&&lane<1){lane++; targetX=lanes[lane+1];}
  if(e.key=='ArrowUp'&&!isJumping){isJumping=true; vy=0.22;}
  if(e.key=='ArrowDown'&&!isRolling){isRolling=true; setTimeout(()=>isRolling=false,400);}
});
renderer.domElement.addEventListener('touchstart',e=>{
  let sy=e.touches[0].clientY;
  renderer.domElement.addEventListener('touchend',function h(ev){
    let dy=ev.changedTouches[0].clientY-sy;
    if(dy<-40&&!isJumping){isJumping=true; vy=0.22;}
    if(dy>40&&!isRolling){isRolling=true; setTimeout(()=>isRolling=false,400);}
    renderer.domElement.removeEventListener('touchend',h);
  });
});

function animate(){
 if(!game)return;
 requestAnimationFrame(animate);
 runTime+=clock.getDelta();
 score+=speed*2; document.getElementById('score').innerText=Math.floor(score);
 speed+=0.0003;

 // movimento suave de trilho
 playerGroup.position.x+=(targetX-playerGroup.position.x)*0.15;
 // pulo
 if(isJumping){ y+=vy; vy-=0.015; if(y<=0){y=0; isJumping=false;}}
 playerGroup.position.y=y + (isRolling? -0.4:0);
 body.scale.y=isRolling?0.5:1;
 // correr animado
 leg1.rotation.x=Math.sin(runTime*12)*0.8;
 leg2.rotation.x=-Math.sin(runTime*12)*0.8;

 if(Math.random()<0.03)addObstacle();
 if(Math.random()<0.05)addCoin();

 for(let o of obstacles){
   o.position.z+=speed*2+score*0.001;
   // colisao
   if(Math.abs(o.position.z-playerGroup.position.z)<1.2 && Math.abs(o.position.x-playerGroup.position.x)<1.2){
     if(o.userData.low){ if(!isRolling && y<0.5) die(); } else { if(y<1.2) die(); }
   }
 }
 for(let c of coinMeshes){
   c.position.z+=speed*2; c.rotation.y+=0.1;
   if(Math.abs(c.position.z-playerGroup.position.z)<1 && Math.abs(c.position.x-playerGroup.position.x)<1){ coins++; document.getElementById('coins').innerText=coins; c.position.z=100; }
 }
 obstacles=obstacles.filter(o=>{if(o.position.z>10){scene.remove(o); return false;} return true;});
 coinMeshes=coinMeshes.filter(o=>{if(o.position.z>10){scene.remove(o); return false;} return true;});
 renderer.render(scene, camera);
}
function die(){ game=false; document.getElementById('final').innerText= Math.floor(score)+'m | '+coins+' moedas'; document.getElementById('gameOver').style.display='flex';}
animate();
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
