<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Subway Star Dash</title>
<style>
*{margin:0;padding:0}body{background:#222;overflow:hidden;font-family:Arial Black}
canvas{display:block;margin:0 auto;background:#6d3a22}
#hud{position:fixed;top:0;left:0;right:0;padding:10px;display:flex;justify-content:space-between;color:#fff;font-size:20px}
</style>
</head>
<body>
<div id="hud"><span>⭐ <b id="c">0</b></span><span><b id="s">0</b>m</span></div>
<canvas id="g" width="360" height="640"></canvas>
<script>
const canvas=document.getElementById('g'), ctx=canvas.getContext('2d');
let W=360,H=640,lane=1,lanes=[60,180,300],coins=0,score=0,speed=5;
let playerY=H-120, obstacles=[], coinList=[], game=true;
let keys={}, touchX=0;

function drawTrack(){
  ctx.fillStyle='#6d3a22'; ctx.fillRect(0,0,W,H);
  // trilhos
  for(let l=0;l<3;l++){
    let x=lanes[l];
    ctx.fillStyle='#5a2e18'; ctx.fillRect(x-55,0,110,H);
    ctx.fillStyle='#3d1f0f';
    for(let y=-20;y<H;y+=40){ ctx.fillRect(x-50,y+score%40,100,12); }
    ctx.fillStyle='#c0c8d0'; ctx.fillRect(x-30,0,6,H); ctx.fillRect(x+24,0,6,H);
  }
  // respingos tinta igual foto
  ctx.fillStyle='rgba(255,220,0,0.6)'; ctx.beginPath(); ctx.arc(40,200,15,0,7); ctx.fill();
  ctx.fillStyle='rgba(0,180,255,0.5)'; ctx.beginPath(); ctx.arc(300,350,12,0,7); ctx.fill();
}
function drawPlayer(){
  let x=lanes[lane];
  // sombra
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(x,playerY+28,18,8,0,0,7); ctx.fill();
  // pernas
  ctx.fillStyle='#2a5ab0'; ctx.fillRect(x-12,playerY+10,10,18); ctx.fillRect(x+2,playerY+10,10,18);
  // corpo
  ctx.fillStyle='#e6f0ff'; ctx.fillRect(x-15,playerY-10,30,22);
  // cabeça
  ctx.fillStyle='#ffb17a'; ctx.beginPath(); ctx.arc(x,playerY-18,14,0,7); ctx.fill();
  // boné
  ctx.fillStyle='#0044ff'; ctx.beginPath(); ctx.arc(x,playerY-20,14,0,3.14,true); ctx.fill();
  ctx.fillStyle='#ffcc00'; ctx.fillRect(x-14,playerY-20,28,5);
}
function drawCoin(x,y){
  // moeda igual foto
  ctx.fillStyle='#ffcc00'; ctx.beginPath(); ctx.arc(x,y,18,0,7); ctx.fill();
  ctx.fillStyle='#ff3300'; ctx.beginPath(); ctx.arc(x,y,13,0,7); ctx.fill();
  ctx.fillStyle='#ffaa00'; ctx.beginPath(); ctx.arc(x,y,8,0,7); ctx.fill();
  ctx.fillStyle='yellow'; ctx.font='bold 14px Arial'; ctx.textAlign='center'; ctx.fillText('★',x,y+5);
}
function addObs(){
  let l=Math.floor(Math.random()*3);
  let type=Math.random()<0.6?'train':'bar';
  obstacles.push({lane:l,y:-60,type:type,color:type=='train'?['#ffcc00','#ff4444','#555'][Math.floor(Math.random()*3)]:'#d22'});
}
function addCoin(){ coinList.push({lane:Math.floor(Math.random()*3),y:-40}); }

function update(){
  if(!game)return;
  score+=speed*0.1; speed+=0.002;
  document.getElementById('s').innerText=Math.floor(score);
  document.getElementById('c').innerText=coins;
  drawTrack();
  if(Math.random()<0.03)addObs();
  if(Math.random()<0.06)addCoin();
  // obstaculos
  for(let o of obstacles){
    o.y+=speed;
    let x=lanes[o.lane];
    if(o.type=='train'){
      ctx.fillStyle=o.color; ctx.fillRect(x-35,o.y,70,45);
      ctx.fillStyle='#87ceeb'; ctx.beginPath(); ctx.arc(x,o.y+15,8,0,7); ctx.fill();
    }else{
      ctx.fillStyle=o.color; ctx.fillRect(x-35,o.y+20,70,14);
    }
    if(Math.abs(o.y-playerY)<30 && o.lane==lane){
      if(o.type=='bar'){ game=false; alert('BATEU! '+Math.floor(score)+'m | '+coins+' estrelas'); location.reload(); }
      else if(o.type=='train'){ game=false; alert('BATEU! '+Math.floor(score)+'m | '+coins+' estrelas'); location.reload(); }
    }
  }
  // moedas
  for(let c of coinList){
    c.y+=speed; drawCoin(lanes[c.lane],c.y);
    if(Math.abs(c.y-playerY)<30 && c.lane==lane){ coins++; c.y=1000; }
  }
  obstacles=obstacles.filter(o=>o.y<H+60);
  coinList=coinList.filter(c=>c.y<H+60);
  drawPlayer();
  requestAnimationFrame(update);
}
// controles
canvas.addEventListener('touchstart',e=>touchX=e.touches[0].clientX);
canvas.addEventListener('touchend',e=>{
  let dx=e.changedTouches[0].clientX-touchX;
  if(dx>30 && lane<2)lane++;
  if(dx<-30 && lane>0)lane--;
});
window.addEventListener('keydown',e=>{
  if(e.key=='ArrowLeft'&&lane>0)lane--;
  if(e.key=='ArrowRight'&&lane<2)lane++;
});
update();
</script>
</body>
</html>
