<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Bubble Shooter Brasil</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{background:#0a1020;color:#fff;font-family:Arial Black;overflow:hidden}
#top{height:46px;background:linear-gradient(#1a2a5a,#0a1020);display:flex;justify-content:space-between;align-items:center;padding:0 12px;border-bottom:3px solid #ffcc00}
#game{width:100%;max-width:400px;height:100vh;margin:0 auto;display:flex;flex-direction:column}
canvas{flex:1;width:100%;display:block;background:radial-gradient(#1a3a7a,#0a1020)}
#aim{position:absolute;bottom:110px;left:50%;transform:translateX(-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(#fff,#ddd);border:3px solid #000;box-shadow:0 0 15px rgba(255,255,255,0.6)}
</style>
</head><body>
<div id="game">
<div id="top"><span>⭐ <b id="score">0</b></span><span style="color:#ff0">BUBBLE BRASIL</span><span>⏱ <b id="time">60</b></span></div>
<div style="position:relative;flex:1">
<canvas id="c" width="400" height="700"></canvas>
</div>
</div>
<script>
const cv=document.getElementById('c'),X=cv.getContext('2d'),W=400,H=700;
let bubbles=[],nextColor,curX=200,curY=620,aimX=200,aimY=200,aiming=false,score=0,time=60;
let colors=['#ff2a2a','#2aff2a','#2a7aff','#ffeb2a','#ff2aff','#2affff'];
let cols=10,rows=8,rad=18;

function randCol(){return colors[Math.floor(Math.random()*colors.length)];}
function init(){
 bubbles=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){if(r>4&&Math.random()<0.3)continue;let x=20+c*36+(r%2)*18,y=20+r*32;bubbles.push({x,y,c:randCol(),alive:true});}
 nextColor=randCol();time=60;score=0;
}
function draw(){
 X.clearRect(0,0,W,H);
 // grid
 bubbles.forEach(b=>{if(!b.alive)return;
  X.fillStyle='rgba(0,0,0,0.4)';X.beginPath();X.arc(b.x+3,b.y+4,rad,0,7);X.fill();
  X.fillStyle=b.c;X.beginPath();X.arc(b.x,b.y,rad,0,7);X.fill();
  X.fillStyle='rgba(255,255,255,0.6)';X.beginPath();X.arc(b.x-5,b.y-5,5,0,7);X.fill();
 });
 // aim line
 if(aiming){X.strokeStyle='#fff';X.setLineDash([8,6]);X.lineWidth=2;X.beginPath();X.moveTo(curX,curY);X.lineTo(aimX,aimY);X.stroke();X.setLineDash([]);
  X.strokeStyle='#ffff00';X.lineWidth=2;X.beginPath();X.arc(aimX,aimY,18,0,7);X.stroke();}
 // current bubble
 X.fillStyle=nextColor;X.beginPath();X.arc(curX,curY,rad+3,0,7);X.fill();
 X.fillStyle='rgba(255,255,255,0.8)';X.beginPath();X.arc(curX-4,curY-4,5,0,7);X.fill();
 X.strokeStyle='#fff';X.lineWidth=2.5;X.stroke();
}
function getClosest(x,y){let best=null,dist=999;bubbles.forEach(b=>{if(!b.alive)return;let d=Math.hypot(b.x-x,b.y-y);if(d<dist){dist=d;best=b;}});return best;}

function shoot(){
 let dx=aimX-curX,dy=aimY-curY,d=Math.hypot(dx,dy);dx/=d;dy/=d;
 let bx=curX,by=curY,steps=0;
 let iv=setInterval(()=>{
  bx+=dx*12;by+=dy*12;steps++;
  if(bx<rad||bx>W-rad)dx*=-1;
  if(by<30){clearInterval(iv);place(bx,by);return;}
  let hit=bubbles.find(b=>b.alive&&Math.hypot(b.x-bx,b.y-by)<rad*1.9);
  if(hit||steps>80){clearInterval(iv);place(bx,by);}
 },16);
}
function place(x,y){
 let nb={x,y:Math.max(20,y),c:nextColor,alive:true};bubbles.push(nb);nextColor=randCol();
 checkPop(nb);
}
function checkPop(start){
 let same=[start],queue=[start],vis=new Set([start]);
 while(queue.length){let cur=queue.pop();bubbles.forEach(b=>{if(!b.alive||vis.has(b)||b.c!==cur.c)return;if(Math.hypot(b.x-cur.x,b.y-cur.y)<38){vis.add(b);same.push(b);queue.push(b);}});}
 if(same.length>=3){same.forEach(b=>b.alive=false);score+=same.length*10;document.getElementById('score').innerText=score;}
}
cv.addEventListener('touchstart',e=>{let t=e.touches[0],r=cv.getBoundingClientRect();aimX=(t.clientX-r.left)*(W/r.width);aimY=(t.clientY-r.top)*(H/r.height);aiming=true;});
cv.addEventListener('touchmove',e=>{let t=e.touches[0],r=cv.getBoundingClientRect();aimX=(t.clientX-r.left)*(W/r.width);aimY=(t.clientY-r.top)*(H/r.height);});
cv.addEventListener('touchend',()=>{if(aiming){aiming=false;shoot();}});
cv.addEventListener('mousedown',e=>{let r=cv.getBoundingClientRect();aimX=(e.clientX-r.left)*(W/r.width);aimY=(e.clientY-r.top)*(H/r.height);aiming=true;});
cv.addEventListener('mousemove',e=>{if(!aiming)return;let r=cv.getBoundingClientRect();aimX=(e.clientX-r.left)*(W/r.width);aimY=(e.clientY-r.top)*(H/r.height);});
cv.addEventListener('mouseup',()=>{if(aiming){aiming=false;shoot();}});
setInterval(()=>{if(time>0){time--;document.getElementById('time').innerText=time;} },1000);
init();(function loop(){draw();requestAnimationFrame(loop);})();
</script></body></html>
